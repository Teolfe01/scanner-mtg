name: Teste no simulador de iPhone
on: workflow_dispatch
jobs:
  sim:
    runs-on: macos-15
    steps:
      - name: Abrir o site no Safari do simulador
        run: |
          xcrun simctl list devices available | grep -i iphone | head -5
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "UDID=$UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl openurl "$UDID" "https://teolfe01.github.io/scanner-mtg/"
          for i in 1 2 3 4; do sleep 20; xcrun simctl io "$UDID" screenshot "shot$i.png"; done
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "com.apple.WebKit.WebContent" AND (eventMessage CONTAINS "crash" OR eventMessage CONTAINS "memory" OR eventMessage CONTAINS "jetsam" OR messageType == error)' 2>/dev/null | tail -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios, path: "shot*.png" }
