name: Teste no Safari (WebKit)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/webkit_test.mjs", ".github/workflows/webkit-test.yml"]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1 && npx playwright install webkit
      - run: node tools/webkit_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: webkit, path: webkit.png }
