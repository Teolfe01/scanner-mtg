name: Dados de precons
on:
  workflow_dispatch:
  schedule: [{ cron: "17 7 * * 3" }]
  push:
    branches: [main]
    paths: ["tools/build_precons.py", ".github/workflows/precons.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar decks do MTGJSON
        run: curl -fsSL -A "BibliotecaMTG/1.0" -o /tmp/decks.tar.gz https://mtgjson.com/api/v5/AllDeckFiles.tar.gz && ls -la /tmp/decks.tar.gz
      - name: Gerar data/precons.json.gz
        run: python3 tools/build_precons.py /tmp/decks.tar.gz
      - name: Salvar se mudou
        run: |
          git config user.name "Scanner MTG"; git config user.email "noreply@users.noreply.github.com"
          git add data/precons.json.gz
          git diff --cached --quiet || (git commit -m "Atualiza dados de precons" && git pull --rebase && git push)
