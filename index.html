<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2129">
<title>Scanner MTG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: câmera em tela cheia com moldura-guia da carta; barra de status embaixo; folha de resultado que sobe com a carta reconhecida; lista da sessão em outra folha. Tema escuro único. */
:root {
  --bg: #1d2129; --bar: #262b34; --surface: #2b3039; --surface-2: #343a45;
  --ink: #eef1f6; --muted: #9aa3b3; --line: #3a404c;
  --accent: #f2a35e; --accent-ink: #1d1a16; --link: #7ea8de; --ok: #55d08d; --warn: #f0b04a; --bad: #f08a7a;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 15px/1.4 var(--font); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.hidden { display: none !important; }

#stage { position: fixed; inset: 0; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.shade { position: absolute; inset: 0; pointer-events: none; }
.guide { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); aspect-ratio: 63 / 88; width: min(64vw, 50vh * 63 / 88); border-radius: 4.5% / 3.2%;
  box-shadow: 0 0 0 200vmax rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.85); transition: border-color .15s; }
.guide.seen { border-color: var(--warn); }
.guide.lock { border-color: var(--ok); }
.guide .band { position: absolute; left: 5%; right: 5%; border: 1.5px dashed rgba(255,255,255,.55); border-radius: 4px; }
.guide .band.title { top: 2.5%; height: 8%; }
.guide .band.foot { bottom: 1.8%; height: 8.5%; right: 45%; }
.guide .lbl { position: absolute; left: 0; top: -22px; font-size: 11px; color: rgba(255,255,255,.8); white-space: nowrap; }

.top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; display: flex; gap: 8px; align-items: center; background: linear-gradient(rgba(0,0,0,.7), transparent); }
.top h1 { margin: 0 auto 0 4px; font-size: 18px; font-weight: 600; }
.chipbtn { border: 1px solid rgba(255,255,255,.25); background: rgba(30,33,40,.75); color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.focusring { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border: 2px solid #ffd54a; border-radius: 50%; pointer-events: none; }
.focusring.go { animation: ring 1s ease-out forwards; }
@keyframes ring { from { transform: scale(1.5); opacity: 1; } to { transform: scale(1); opacity: .2; } }
.mf { position: absolute; left: 12px; right: 12px; bottom: calc(166px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; background: rgba(20,22,26,.75); padding: 8px 12px; border-radius: 14px; }
.mf input { flex: 1; accent-color: var(--accent); }
.mflbl { font-size: 11px; color: #cfd5df; white-space: nowrap; }
.status { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(118px + env(safe-area-inset-bottom)); background: rgba(20,22,26,.85); padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
.listbtn { display: inline-flex; align-items: center; gap: 10px; border: 0; background: rgba(30,33,40,.85); color: #fff; padding: 10px 16px; border-radius: 16px; font-weight: 600; }
.listbtn b { background: var(--accent); color: var(--accent-ink); min-width: 28px; height: 28px; border-radius: 999px; display: inline-grid; place-items: center; padding: 0 7px; }
.roundbtn { width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(30,33,40,.85); color: #fff; display: grid; place-items: center; }
.roundbtn svg { width: 26px; height: 26px; }
.roundbtn[aria-pressed="true"] { background: #fff3c4; color: #222; }

/* Folhas */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; background: var(--bar); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.6); z-index: 20; display: grid; grid-template-rows: auto 1fr auto; padding-bottom: env(safe-area-inset-bottom); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #4a515e; margin: 8px auto 0; }
.sheet .body { overflow: auto; padding: 12px 16px; }
.sheet .foot { padding: 10px 16px 14px; display: flex; gap: 10px; border-top: 1px solid var(--line); }
.btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-weight: 600; min-height: 50px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { flex: none; min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: var(--bad); }

.result { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
.result img, .result .ph { width: 112px; aspect-ratio: 488/680; border-radius: 6px; background: #111; object-fit: cover; }
.result h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.2; }
.meta { color: var(--muted); font-size: 13px; }
.price { font-size: 16px; font-weight: 600; margin: 6px 0; font-variant-numeric: tabular-nums; }
.via { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 6px; margin-top: 4px; }
.via.ok { color: var(--ok); background: rgba(85,208,141,.1); }
.via.warn { color: var(--warn); background: rgba(240,176,74,.1); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.opts label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-height: 42px; width: 100%; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 14px; }
.row3 { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; height: 44px; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 44px; height: 100%; font-size: 22px; color: var(--accent); }
.stepper span { min-width: 30px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 15px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 12px; padding: 6px 10px 6px 6px; }
.item img, .item .ph { width: 44px; aspect-ratio: 488/680; border-radius: 3px; object-fit: cover; background: #111; }
.item .nm { font-weight: 600; overflow-wrap: anywhere; }
.item .act { display: flex; gap: 4px; align-items: center; }
.item .act button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 18px; }
.sum { display: flex; justify-content: space-between; color: var(--link); font-style: italic; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); background: #eef1f6; color: #1d2129; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.splash { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; }
.splash .box { display: grid; gap: 14px; max-width: 360px; }
.splash h2 { margin: 0; font-size: 22px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <div class="guide" id="guide"><div class="band title"><span class="lbl">nome</span></div><div class="band foot"><span class="lbl" style="top:auto;bottom:-20px">coleção · número</span></div></div>
  <div class="top">
    <h1>Scanner</h1>
    <button class="chipbtn" id="infoBtn" aria-label="Informações da câmera">ⓘ</button>
    <button class="chipbtn" id="autoBtn" aria-pressed="false" title="Adiciona sozinho quando reconhecer">Auto</button>
    <button class="chipbtn" id="foilBtn" aria-pressed="false" title="Marcar as próximas como foil">Foil</button>
    <select id="langSel" class="chipbtn" aria-label="Idioma das próximas cartas" style="width:auto;min-height:0;padding:7px 10px">
      <option value="">Idioma: auto</option><option value="en">EN</option><option value="pt">PT</option><option value="es">ES</option><option value="ja">JA</option><option value="fr">FR</option><option value="de">DE</option><option value="it">IT</option>
    </select>
  </div>
  <div class="status" id="status">Iniciando…</div>
  <div class="focusring hidden" id="focusRing"></div>
  <div class="mf hidden" id="mfWrap">
    <button class="chipbtn" id="afBtn" aria-pressed="true">AF</button>
    <input type="range" id="mfRange" aria-label="Foco manual (perto ↔ longe)">
    <span class="mflbl">perto ↔ longe</span>
  </div>
  <div class="bottom">
    <button class="listbtn" id="listBtn">Lista <b id="count">0</b></button>
    <button class="chipbtn hidden" id="camSwitch" aria-label="Trocar lente">Lente</button>
    <label class="roundbtn" id="photoBtn" aria-label="Tirar foto com a câmera do celular" title="Foto com foco da câmera do celular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none"></label>
    <button class="roundbtn hidden" id="zoomBtn" aria-label="Zoom" style="font-weight:700;font-size:16px">2×</button>
    <button class="roundbtn" id="torchBtn" aria-pressed="false" aria-label="Lanterna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 2h6v5l-2 3v12h-2V10L9 7z"/></svg></button>
  </div>
</div>

<!-- Resultado -->
<div class="sheet hidden" id="resSheet" role="dialog" aria-label="Carta reconhecida">
  <div class="grab"></div>
  <div class="body" id="resBody"></div>
  <div class="foot">
    <button class="btn" id="skipBtn">Pular</button>
    <button class="btn primary" id="addBtn">Adicionar</button>
  </div>
</div>

<!-- Lista -->
<div class="sheet hidden" id="listSheet" role="dialog" aria-label="Cartas escaneadas">
  <div class="grab"></div>
  <div class="body" id="listBody"></div>
  <div class="foot" style="flex-wrap:wrap">
    <button class="btn" id="closeList">Voltar à câmera</button>
    <button class="btn primary" id="copyBtn">Copiar para a Biblioteca</button>
    <button class="btn small" id="dlBtn">Baixar CSV</button>
    <button class="btn small danger" id="clearBtn">Limpar lista</button>
  </div>
</div>

<div class="splash" id="splash">
  <div class="box">
    <h2>Scanner MTG</h2>
    <p class="meta" id="splashMsg">Carregando o leitor e a lista de cartas (só na primeira vez, cerca de 10 MB)…</p>
    <div class="bar"><i id="splashBar"></i></div>
    <button class="btn primary hidden" id="startBtn">Abrir a câmera</button>
  </div>
</div>

<script src="lib/tesseract.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
  const normNum = (n) => String(n || "").toLowerCase().split("/")[0].replace(/[^0-9a-z★†\-]/g, "").replace(/^0+(?=\d)/, "");
  function toast(msg, ms = 2200) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
  const fmtUSD = (v) => v ? "US$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "";
  const LANG_CODES = { EN: "en", PT: "pt", SP: "es", ES: "es", FR: "fr", DE: "de", IT: "it", JP: "ja", JA: "ja", KO: "ko", RU: "ru", CS: "zhs", CT: "zht", ZHS: "zhs", ZHT: "zht" };

  // ---------- Índice local (nomes + coleção/número) ----------
  const IDX = { names: [], normNames: [], byLen: new Map(), bySetNum: new Map(), sets: new Set(), prints: [] };
  async function loadIndex() {
    const r = await fetch("data/index.json"); const d = await r.json();
    IDX.names = d.names; IDX.built = d.built;
    d.names.forEach((n, i) => {
      const parts = n.includes(" // ") ? [n, ...n.split(" // ")] : [n];
      parts.forEach(pn => { const k = norm(pn); if (!IDX.byLen.has(k.length)) IDX.byLen.set(k.length, []); IDX.byLen.get(k.length).push([k, i]); });
      IDX.prints[i] = [];
    });
    d.p.forEach((p, i) => { IDX.bySetNum.set(p[0] + "|" + normNum(p[1]), p); IDX.sets.add(p[0]); IDX.prints[p[2]].push(p); });
  }
  function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i]; let best = i;
      for (let j = 1; j <= b.length; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (cur[j] < best) best = cur[j]; }
      if (best > max) return max + 1; prev = cur;
    }
    return prev[b.length];
  }
  function matchName(text) {
    const k = norm(text); if (k.length < 4) return null;
    const max = k.length < 6 ? 0 : Math.max(1, Math.floor(k.length * 0.2));
    let best = null;
    for (let L = k.length - max; L <= k.length + max; L++) {
      for (const [n, i] of (IDX.byLen.get(L) || [])) {
        const d = lev(k, n, best ? Math.min(max, best.d) : max);
        if (d <= max && (!best || d < best.d)) { best = { i, d }; if (d === 0) return best; }
      }
    }
    return best;
  }
  function parseFoot(text) {
    // Rodapé: linha 1 = número (ex. "199/274 C" ou "C 0150"); linha 2 = coleção + idioma (ex. "M21 • PT")
    const lines = String(text || "").toUpperCase().replace(/[|\\]/g, " ").split(/\n/).map(l => l.trim()).filter(Boolean);
    const firstNum = (l) => { const m = l.replace(/[©®™].*$/, "").match(/(?:^|[^A-Z0-9])0*(\d{1,4})(?=[^0-9]|$)/); return m ? m[1] : null; };
    const langM = lines.join(" ").match(/\b(EN|PT|SP|ES|FR|DE|IT|JP|JA|KO|RU|CS|CT)\b/);
    const out = [], sets = [];
    lines.forEach((l, i) => {
      const toks = [...l.matchAll(/\b[A-Z0-9]{3,5}\b/g)].map(m => m[0].toLowerCase()).filter(t => IDX.sets.has(t));
      if (!toks.length) return;
      sets.push(...toks);
      const nums = [];
      const slash = l.match(/0*(\d{1,4})\s*\/\s*\d{1,4}/); if (slash) nums.push(slash[1]);
      if (i > 0) { const pl = lines[i - 1]; const s2 = pl.match(/0*(\d{1,4})\s*\/\s*\d{1,4}/); nums.push(s2 ? s2[1] : firstNum(pl)); }
      nums.push(firstNum(l));
      for (const t of toks) for (const n of nums) { if (!n) continue; const p = IDX.bySetNum.get(t + "|" + n); if (p && !out.includes(p)) out.push(p); }
    });
    return { prints: out, sets, lang: langM ? LANG_CODES[langM[1]] : "" };
  }

  // ---------- Câmera ----------
  let stream = null, track = null;
  async function startCamera(deviceId) {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("Este navegador não dá acesso à câmera. Abra a página no Chrome, por https.");
    if (stream) stream.getTracks().forEach(t => t.stop());
    const video = { width: { ideal: 3840 }, height: { ideal: 2160 } };
    if (deviceId) video.deviceId = { exact: deviceId }; else video.facingMode = { ideal: "environment" };
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
    track = stream.getVideoTracks()[0];
    try { await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch {}
    const v = $("video"); v.srcObject = stream; await v.play();
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $("torchBtn").classList.toggle("hidden", !caps.torch);
    // Zoom: deixa segurar o celular mais longe (onde a câmera consegue focar) com a carta grande na tela
    ZOOM.caps = caps.zoom || null;
    if (ZOOM.caps && ZOOM.caps.max > 1) {
      ZOOM.levels = [1, 1.5, 2, 2.5, 3].filter(z => z >= ZOOM.caps.min && z <= ZOOM.caps.max);
      let saved = 2; try { saved = parseFloat(localStorage.getItem("mtgscan.zoom")) || 2; } catch {}
      await setZoom(ZOOM.levels.includes(saved) ? saved : ZOOM.levels[Math.min(2, ZOOM.levels.length - 1)]);
      $("zoomBtn").classList.remove("hidden");
    } else {
      $("zoomBtn").classList.add("hidden");
    }
    // Foco: modos suportados e foco manual
    FOCUS.modes = caps.focusMode || [];
    FOCUS.dist = caps.focusDistance && caps.focusDistance.max > caps.focusDistance.min ? caps.focusDistance : null;
    $("mfWrap").classList.toggle("hidden", !FOCUS.dist);
    if (FOCUS.dist) { const r = $("mfRange"); r.min = FOCUS.dist.min; r.max = FOCUS.dist.max; r.step = FOCUS.dist.step || 0.01; r.value = FOCUS.dist.min + (FOCUS.dist.max - FOCUS.dist.min) * 0.15; }
    setAF();
    // Lentes traseiras disponíveis
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
      const back = devs.filter(d => !/front|frontal|user|facing front/i.test(d.label));
      CAMS.list = back.length ? back : devs;
      const cur = track.getSettings ? track.getSettings().deviceId : "";
      CAMS.idx = Math.max(0, CAMS.list.findIndex(d => d.deviceId === cur));
      $("camSwitch").classList.toggle("hidden", CAMS.list.length < 2);
      $("camSwitch").textContent = `Lente ${CAMS.idx + 1}/${CAMS.list.length}`;
      // Android (Samsung e outros): a câmera principal é a "camera2 0"; as outras costumam ser grande-angular (foco fixo) ou tele
      if (!deviceId && !CAMS.autoPicked) {
        CAMS.autoPicked = true;
        const main = CAMS.list.find(d => /camera2 0\b/.test(d.label)) || CAMS.list.find(d => /back|traseira|rear/i.test(d.label) && /\b0\b/.test(d.label));
        if (main && main.deviceId !== cur) { await startCamera(main.deviceId); return; }
      }
    } catch {}
  }
  const FOCUS = { modes: [], dist: null, manual: false };
  const CAMS = { list: [], idx: 0 };
  async function setAF() {
    FOCUS.manual = false; $("afBtn").setAttribute("aria-pressed", "true");
    if (FOCUS.modes.includes("continuous")) { try { await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch {} }
  }
  $("afBtn").onclick = () => { setAF(); toast("Foco automático", 900); };
  $("mfRange").addEventListener("input", async (e) => {
    FOCUS.manual = true; $("afBtn").setAttribute("aria-pressed", "false");
    try { await track.applyConstraints({ advanced: [{ focusMode: "manual", focusDistance: parseFloat(e.target.value) }] }); } catch {}
  });
  $("camSwitch").onclick = async () => {
    if (CAMS.list.length < 2) return;
    CAMS.idx = (CAMS.idx + 1) % CAMS.list.length;
    try { await startCamera(CAMS.list[CAMS.idx].deviceId); try { localStorage.setItem("mtgscan.cam", CAMS.list[CAMS.idx].deviceId); } catch {} }
    catch (e) { toast("Não consegui abrir essa lente."); }
  };
  // Toque para focar no ponto tocado
  $("stage").addEventListener("pointerup", async (ev) => {
    if (!track || ev.target.closest("button, select, input, label, .top, .bottom, #mfWrap")) return;
    const v = $("video"), vb = v.getBoundingClientRect(), VW = v.videoWidth, VH = v.videoHeight;
    const sc = Math.max(vb.width / VW, vb.height / VH), ox = vb.left + (vb.width - VW * sc) / 2, oy = vb.top + (vb.height - VH * sc) / 2;
    const px = Math.min(1, Math.max(0, (ev.clientX - ox) / sc / VW)), py = Math.min(1, Math.max(0, (ev.clientY - oy) / sc / VH));
    const ring = $("focusRing"); ring.style.left = ev.clientX + "px"; ring.style.top = ev.clientY + "px"; ring.classList.remove("hidden"); ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");

      bar.style.width = "100%";
    } catch (e) { msg.textContent = "Não consegui carregar o leitor: " + (e.message || e); return; }
    msg.textContent = `Pronto. ${IDX.names.length.toLocaleString("pt-BR")} cartas na lista. Toque para abrir a câmera.`;
    $("startBtn").classList.remove("hidden");
  }
  $("startBtn").onclick = async () => {
    let savedCam = ""; try { savedCam = localStorage.getItem("mtgscan.cam") || ""; } catch {}
    try { try { await startCamera(savedCam || undefined); } catch (e0) { if (!savedCam) throw e0; await startCamera(); } } catch (e) { $("splashMsg").textContent = (e.name === "NotAllowedError" ? "Permissão de câmera negada. Libere a câmera para este site nas configurações do navegador." : (e.message || String(e))); return; }
    $("splash").classList.add("hidden");
    setStatus("Segure a uns 20 cm e use o zoom; toque para focar");
    setInterval(tick, 250);
  };
  boot();
})();
</script>
</body>
</html>
