<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262b34">
<title>Biblioteca MTG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/mana.css">
<link rel="stylesheet" href="css/keyrune.css">
<style>
/* Layout: app de coleção para celular com navegação inferior (Coleção, Escanear, Decks, Caixas). Barra de título fixa; conteúdo rolável; folhas que sobem de baixo para detalhes. Tema único escuro. */
:root {
  --bg: #1d2129; --bar: #262b34; --surface: #2b3039; --surface-2: #343a45;
  --ink: #eef1f6; --muted: #9aa3b3; --line: #3a404c;
  --accent: #f2a35e; --accent-ink: #1d1a16; --link: #7ea8de; --ok: #55d08d; --warn: #f0b04a; --bad: #f08a7a;
  --fW: #e8e0c4; --fU: #3d7cc0; --fB: #6b6467; --fR: #cf5a40; --fG: #3f9a5c; --fM: #d0a94e; --fC: #9aa3ab; --fL: #9a7a52;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.hidden { display: none !important; }
.invisible { visibility: hidden; }
.meta { color: var(--muted); font-size: 13px; }
.mana { display: inline-flex; gap: 2px; align-items: center; font-size: 14px; flex: none; }

/* Barra de título */
.appbar { position: sticky; top: 0; z-index: 10; background: var(--bar); box-shadow: 0 1px 0 rgba(0,0,0,.35); padding-top: env(safe-area-inset-top); }
.titlebar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 8px 10px 4px; max-width: 900px; margin: 0 auto; }
.titlebar h1 { margin: 0; text-align: center; font-size: 20px; font-weight: 600; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); position: relative; }
.iconbtn:hover { background: rgba(255,255,255,.06); }
.iconbtn svg { width: 24px; height: 24px; }
.iconbtn select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; padding: 4px 12px 10px; max-width: 900px; margin: 0 auto; }
.toolbar input { border: 0; background: #3a404b; border-radius: 12px; padding: 0 14px; height: 44px; font-size: 16px; width: 100%; min-width: 0; }
.toolbar input::placeholder { color: #a7afbd; }
.subbar { background: #1f2a36; }
.subrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; }
.count { color: var(--link); font-style: italic; font-variant-numeric: tabular-nums; }
.addfilter { border: 0; background: transparent; color: var(--link); font-style: italic; display: inline-flex; align-items: center; gap: 8px; padding: 0; }
.addfilter .plus { width: 32px; height: 32px; border-radius: 50%; background: #5a7ea8; color: #10161d; display: grid; place-items: center; font-size: 22px; font-style: normal; font-weight: 700; }
.filterpanel { display: grid; gap: 10px; padding: 0 14px 12px; max-width: 900px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--link); background: rgba(126,168,222,.18); color: #cfe0f6; }
.chip .ms { font-size: 18px; }
select, input[type="text"], input[type="search"], input[type="number"], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 11px; min-height: 42px; width: 100%; color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

main { max-width: 900px; margin: 0 auto; padding: 12px 12px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom)); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 4px 8px; font-weight: 600; display: flex; justify-content: space-between; }

/* Navegação inferior */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--bar); box-shadow: 0 -1px 0 rgba(0,0,0,.4); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); }
nav.bottom button { border: 0; background: transparent; color: var(--muted); height: var(--nav-h); display: grid; place-items: center; gap: 2px; font-size: 12px; padding: 6px 0; }
nav.bottom button svg { width: 24px; height: 24px; }
nav.bottom button[aria-current="page"] { color: var(--accent); }

/* Grade */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 860px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 0; border-radius: 14px; padding: 8px 6px 6px; display: grid; gap: 6px; text-align: center; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.25); min-width: 0; }
.tile .tname { font-weight: 600; font-size: 13.5px; line-height: 1.2; min-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; align-self: center; overflow-wrap: anywhere; }
.cardimg { position: relative; aspect-ratio: 488 / 680; border-radius: 6% / 4.3%; overflow: hidden; background: #111; }
.cardimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cardimg .qtyb { position: absolute; left: 6%; top: 3.5%; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; background: rgba(20,22,26,.85); color: #fff; font: 700 14px/26px var(--font); }
.cardimg .price { position: absolute; left: 5%; bottom: 16%; background: rgba(20,22,26,.85); color: #fff; font-weight: 600; font-size: 11px; padding: 5px 7px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cardimg .flag { position: absolute; left: 6%; bottom: 5%; font-size: 15px; line-height: 1; }
.cardimg .flag.txt { font-size: 10px; font-weight: 700; background: rgba(20,22,26,.85); padding: 3px 5px; border-radius: 4px; }
.cardimg .dot { position: absolute; right: 6%; bottom: 5%; width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(20,22,26,.85); background: conic-gradient(#ff9ec7, #9ed8ff, #b6ffa8, #fff59e, #ff9ec7); }
.cardimg .deckb { position: absolute; right: 5%; top: 3.5%; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 6px; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawn { position: absolute; inset: 0; padding: 22% 8% 28%; display: grid; grid-template-rows: auto 1fr auto; gap: 6%; background: linear-gradient(180deg, color-mix(in srgb, var(--frame, var(--fC)) 55%, #1a1a1a), color-mix(in srgb, var(--frame, var(--fC)) 25%, #111)); }
.drawn .dn { background: rgba(255,255,255,.85); color: #1a1a1a; border-radius: 4px; padding: 4px 5px; font-size: 10px; font-weight: 600; text-align: left; }
.drawn .dt { background: rgba(255,255,255,.85); color: #1a1a1a; border-radius: 3px; padding: 3px 5px; font-size: 9px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.f-W { --frame: var(--fW); } .f-U { --frame: var(--fU); } .f-B { --frame: var(--fB); } .f-R { --frame: var(--fR); } .f-G { --frame: var(--fG); } .f-M { --frame: var(--fM); } .f-C { --frame: var(--fC); } .f-L { --frame: var(--fL); }
.setline { display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 13px; min-width: 0; }
.setline .ss { font-size: 17px; }
.setline .num { font-style: italic; font-weight: 400; color: var(--muted); }

/* Listas */
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 0; border-radius: 12px; padding: 6px 10px 6px 6px; text-align: left; color: var(--ink); width: 100%; }
.row .cardimg { width: 44px; border-radius: 3px; }
.row .rn { font-weight: 600; overflow-wrap: anywhere; }
.row .rs { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .rr { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: #cfd5df; background: var(--surface-2); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: rgba(85,208,141,.4); }
.pill.warn { color: var(--warn); border-color: rgba(240,176,74,.4); }
.pill.bad { color: var(--bad); border-color: rgba(240,138,122,.4); }
.pill.acc { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.fab { position: fixed; right: 18px; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); width: 64px; height: 64px; border-radius: 20px; border: 3px solid #7a4a1f; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.5); z-index: 12; }
.fab svg { width: 34px; height: 34px; }

/* Decks */
.deckcard { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px; border: 0; color: var(--ink); text-align: left; width: 100%; }
.deckcard .cardimg { width: 56px; border-radius: 4px; }
.deckcard b { font-size: 16px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.ok i { background: var(--ok); }
.bar.over i { background: var(--bad); }
.curve { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 110px; padding: 6px 0 0; }
.curve div { display: grid; grid-template-rows: auto 1fr auto; align-items: end; justify-items: center; height: 100%; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.curve i { display: block; width: 100%; background: var(--link); border-radius: 4px 4px 0 0; min-height: 2px; }
.colorbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 8px; text-align: center; }
.kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); }
.roles { display: flex; flex-wrap: wrap; gap: 6px; }

/* Caixas */
.boxcard { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.boxcard h3 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; }
.secrow { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; font-size: 14px; padding: 4px 0; border-top: 1px solid var(--line); }
.secrow .sw { width: 14px; height: 14px; border-radius: 3px; }

/* Folhas */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; background: var(--bar); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.6); z-index: 30; display: grid; grid-template-rows: auto 1fr auto; padding-bottom: env(safe-area-inset-bottom); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #4a515e; margin: 8px auto 0; }
.sheet .body { overflow: auto; padding: 12px 16px; display: grid; gap: 12px; align-content: start; }
.sheet .foot { padding: 10px 16px 14px; display: flex; gap: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet .foot .btn { flex: 1; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 29; }
.detail { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; }
.detail .cardimg { width: 120px; }
.detail h3 { margin: 0 0 4px; font-size: 19px; line-height: 1.2; }
.textbox { background: var(--surface); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; height: 40px; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 40px; height: 100%; font-size: 20px; color: var(--accent); }
.stepper span { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.loc { display: grid; gap: 6px; }
.loc div { display: flex; justify-content: space-between; gap: 8px; background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); background: #eef1f6; color: #1d2129; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.menu { position: absolute; right: 10px; top: 52px; background: var(--surface-2); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 6px; display: grid; min-width: 240px; z-index: 40; }
.menu button { border: 0; background: transparent; text-align: left; padding: 11px 12px; border-radius: 8px; color: var(--ink); }
.menu button:hover { background: rgba(255,255,255,.06); }
.splash { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; }
.splash .box { display: grid; gap: 14px; max-width: 360px; width: 100%; }
.pbar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* Scanner */
#scanView { position: fixed; inset: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: #000; z-index: 5; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.guide { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); aspect-ratio: 63 / 88; width: min(64vw, 46vh * 63 / 88); border-radius: 4.5% / 3.2%; box-shadow: 0 0 0 200vmax rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.85); }
.guide.seen { border-color: var(--warn); } .guide.lock { border-color: var(--ok); }
.guide .band { position: absolute; left: 5%; right: 5%; border: 1.5px dashed rgba(255,255,255,.5); border-radius: 4px; }
.guide .band.t { top: 2.5%; height: 8%; } .guide .band.f { bottom: 1.8%; height: 8.5%; right: 45%; }
.scantop { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; display: flex; gap: 6px; align-items: center; background: linear-gradient(rgba(0,0,0,.75), transparent); flex-wrap: wrap; }
.chipbtn { border: 1px solid rgba(255,255,255,.25); background: rgba(30,33,40,.8); color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scanstatus { position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; background: rgba(20,22,26,.85); padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; color: #fff; }
.scanbottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
.roundbtn { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(30,33,40,.85); color: #fff; display: grid; place-items: center; font-weight: 700; }
.roundbtn svg { width: 24px; height: 24px; }
.roundbtn[aria-pressed="true"] { background: #fff3c4; color: #222; }
.lastscan { display: inline-flex; gap: 8px; align-items: center; border: 0; background: rgba(30,33,40,.85); color: #fff; padding: 8px 12px; border-radius: 14px; font-size: 13px; max-width: 46%; }
.lastscan b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; min-width: 24px; height: 24px; display: inline-grid; place-items: center; padding: 0 6px; }
.focusring { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 2px solid #ffd54a; border-radius: 50%; pointer-events: none; animation: ring 1s ease-out forwards; }
@keyframes ring { from { transform: scale(1.5); opacity: 1; } to { transform: scale(1); opacity: .2; } }
.mf { position: absolute; left: 12px; right: 12px; bottom: 140px; display: flex; align-items: center; gap: 10px; background: rgba(20,22,26,.75); padding: 8px 12px; border-radius: 14px; color: #fff; font-size: 11px; }
.mf input { flex: 1; accent-color: var(--accent); }
.via { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 6px; }
.via.ok { color: var(--ok); background: rgba(85,208,141,.1); } .via.warn { color: var(--warn); background: rgba(240,176,74,.1); }
@media (max-width: 380px) { .tile .tname { font-size: 12.5px; } .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="appbar" id="appbar">
  <div class="titlebar">
    <button class="iconbtn invisible" id="backBtn" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M11 6l-6 6 6 6"/></svg></button>
    <h1 id="title">Coleção</h1>
    <button class="iconbtn" id="menuBtn" aria-label="Mais opções"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button>
  </div>
  <div id="bars"></div>
  <div class="menu hidden" id="menu"></div>
</div>

<main id="main"></main>

<!-- Scanner -->
<div id="scanView" class="hidden">
  <video id="video" playsinline autoplay muted></video>
  <div class="guide" id="guide"><div class="band t"></div><div class="band f"></div></div>
  <div class="scantop">
    <button class="chipbtn" id="autoBtn" aria-pressed="false">Auto</button>
    <button class="chipbtn" id="foilBtn" aria-pressed="false">Foil</button>
    <select id="langSel" class="chipbtn" aria-label="Idioma" style="width:auto;min-height:0;padding:7px 10px"><option value="">Idioma: auto</option><option value="en">EN</option><option value="pt">PT</option><option value="es">ES</option><option value="ja">JA</option><option value="fr">FR</option><option value="de">DE</option><option value="it">IT</option></select>
    <select id="scanDest" class="chipbtn" aria-label="Destino" style="width:auto;min-height:0;padding:7px 10px"></select>
    <button class="chipbtn hidden" id="camSwitch">Lente</button>
    <button class="chipbtn" id="infoBtn" aria-label="Informações da câmera">ⓘ</button>
  </div>
  <div class="mf hidden" id="mfWrap"><button class="chipbtn" id="afBtn" aria-pressed="true">AF</button><input type="range" id="mfRange" aria-label="Foco manual"><span>perto ↔ longe</span></div>
  <div class="scanstatus" id="scanStatus">Abrindo a câmera…</div>
  <div class="scanbottom">
    <button class="lastscan" id="lastScan">Escaneadas <b id="sessCount">0</b></button>
    <button class="roundbtn hidden" id="zoomBtn" aria-label="Zoom">2×</button>
    <label class="roundbtn" aria-label="Foto com a câmera do celular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none"></label>
    <button class="roundbtn hidden" id="torchBtn" aria-pressed="false" aria-label="Lanterna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 2h6v5l-2 3v12h-2V10L9 7z"/></svg></button>
  </div>
</div>

<button class="fab hidden" id="fab" aria-label="Adicionar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button>

<nav class="bottom" id="nav">
  <button data-tab="col" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Coleção</button>
  <button data-tab="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8.5" y="7" width="7" height="10" rx="1"/></svg>Escanear</button>
  <button data-tab="decks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="16" rx="2"/><path d="M4 6v13a2 2 0 0 0 2 2h10"/></svg>Decks</button>
  <button data-tab="boxes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Caixas</button>
</nav>

<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog"><div class="grab"></div><div class="body" id="sheetBody"></div><div class="foot" id="sheetFoot"></div></div>

<div class="splash" id="splash"><div class="box">
  <h2 style="margin:0">Biblioteca MTG</h2>
  <p class="meta" id="splashMsg">Carregando a base de cartas… (só na primeira vez, uns 4 MB)</p>
  <div class="pbar"><i id="splashBar"></i></div>
</div></div>

<script src="lib/tesseract.min.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const normNum = (n) => String(n || "").toLowerCase().split("/")[0].replace(/[^0-9a-z★†\-]/g, "").replace(/^0+(?=\d)/, "");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg, ms = 2200) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const fmtUSD = (c) => c ? "US$ " + (c / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "";
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// ============ Base de cartas (Scryfall, embutida) ============
const DB = { o: [], p: [], sets: {}, roles: [], bySetNum: new Map(), byLen: new Map(), byName: new Map(), prints: [], setCodes: new Set() };
const ROLES = { ramp: "Ramp", fixing: "Correção de mana", draw: "Compra", removal: "Remoção", wipe: "Board wipe", counter: "Contramágica", tutor: "Tutor", tokens: "Fichas", counters: "Marcadores", anthem: "Buff global", pump: "Truque", evasion: "Evasão", protection: "Proteção", recursion: "Recursão", graveyard: "Cemitério", burn: "Dano direto", lifegain: "Ganho de vida", discard: "Descarte", mill: "Mill", sacrifice: "Sacrifício", blink: "Blink", copy: "Cópia", steal: "Roubo", stax: "Taxa/Stax", finisher: "Finalizador" };
const TYPES = [["Creature", "Criaturas"], ["Planeswalker", "Planeswalkers"], ["Instant", "Instantâneas"], ["Sorcery", "Feitiços"], ["Enchantment", "Encantamentos"], ["Artifact", "Artefatos"], ["Battle", "Batalhas"], ["Land", "Terrenos"]];
const RAR = { c: "common", u: "uncommon", r: "rare", m: "mythic", s: "special", b: "bonus" };
async function loadDB(progress) {
  const r = await fetch("data/cards.json.gz");
  const total = +r.headers.get("content-length") || 3500000;
  const reader = r.body.getReader(); const chunks = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; progress(Math.min(.95, got / total)); }
  let blob = new Blob(chunks);
  const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  const txt = head[0] === 31 && head[1] === 139 ? await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).text() : await blob.text();
  const d = JSON.parse(txt);
  Object.assign(DB, { o: d.o, p: d.p, sets: d.sets, roles: d.roles, built: d.built });
  d.o.forEach((o, i) => {
    const parts = o[0].includes(" // ") ? [o[0], ...o[0].split(" // ")] : [o[0]];
    parts.forEach(n => { const k = norm(n); if (!DB.byLen.has(k.length)) DB.byLen.set(k.length, []); DB.byLen.get(k.length).push([k, i]); if (!DB.byName.has(k)) DB.byName.set(k, i); });
    DB.prints[i] = [];
  });
  d.p.forEach((p, i) => { DB.bySetNum.set(p[0] + "|" + normNum(p[1]), i); DB.setCodes.add(p[0]); DB.prints[p[3]].push(i); });
}
const O = (oi) => DB.o[oi]; // [name, mana, cmc, colors, ci, type, text, pt, roles]
function oInfo(oi) {
  const o = DB.o[oi]; if (!o) return null;
  return { name: o[0], mana: o[1], cmc: o[2], colors: o[3].split("").filter(Boolean), ci: o[4].split("").filter(Boolean), type: o[5], text: o[6], pt: o[7], roles: o[8].split("").map(ch => DB.roles[parseInt(ch, 36)]).filter(r => ROLES[r]) };
}
function mainTypes(type) { const f = String(type || "").split("—")[0]; return TYPES.map(t => t[0]).filter(t => f.includes(t)); }
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) { const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (cur[j] < best) best = cur[j]; }
    if (best > max) return max + 1; prev = cur; }
  return prev[b.length];
}
function matchName(text, strict = true) {
  const k = norm(text); if (k.length < 4) return null;
  if (DB.byName.has(k)) return { i: DB.byName.get(k), d: 0 };
  const max = k.length < 6 ? (strict ? 0 : 1) : Math.max(1, Math.floor(k.length * 0.2));
  let best = null;
  for (let L = k.length - max; L <= k.length + max; L++) for (const [n, i] of (DB.byLen.get(L) || [])) {
    const d = lev(k, n, best ? Math.min(max, best.d) : max); if (d <= max && (!best || d < best.d)) { best = { i, d }; if (d === 0) return best; } }
  return best;
}
function searchNames(q, limit = 12) {
  const k = norm(q); if (k.length < 2) return [];
  const out = [];
  for (let i = 0; i < DB.o.length && out.length < limit; i++) if (norm(DB.o[i][0]).startsWith(k)) out.push(i);
  if (out.length < limit) for (let i = 0; i < DB.o.length && out.length < limit; i++) { const n = norm(DB.o[i][0]); if (!n.startsWith(k) && n.includes(k)) out.push(i); }
  return out;
}
function defaultPrint(oi) {
  const list = DB.prints[oi] || []; if (!list.length) return -1;
  const promo = (c) => (c.length === 4 && c[0] === "p") || ["sld", "plst", "slp"].includes(c);
  const normal = list.filter(pi => !promo(DB.p[pi][0]) && !DB.p[pi][4]);
  const L = normal.length ? normal : list; return L[L.length - 1];
}
const priceOf = (e) => { const pi = DB.bySetNum.get(e.set + "|" + normNum(e.number)); if (pi === undefined) return 0; const p = DB.p[pi]; return e.foil ? (p[7] || p[6] || 0) : (p[6] || p[7] || 0); };
const rarityOf = (e) => { const pi = DB.bySetNum.get(e.set + "|" + normNum(e.number)); return pi === undefined ? "c" : DB.p[pi][2]; };

// ============ Armazenamento local (IndexedDB) ============
const store = {
  db: null,
  async open() { this.db = await new Promise((res, rej) => { const r = indexedDB.open("biblioteca-mtg", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { return new Promise((res) => { const t = this.db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); },
  async set(k, v) { return new Promise((res, rej) => { const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
const S = { cards: [], decks: [], boxes: { capacity: 250, layout: null }, settings: {} };
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(async () => { try { await store.set("cards", S.cards); await store.set("decks", S.decks); await store.set("boxes", S.boxes); await store.set("settings", S.settings); } catch (e) { toast("Erro ao salvar no aparelho: " + e.message); } }, 250); }

// Entrada de carta: { key, oi, name, set, number, lang, foil, qty, img, added, decks: {deckId: qty} }
const entryKey = (set, number, foil, lang) => [set, normNum(number), foil ? "f" : "n", lang || "en"].join("|");
const inDecks = (e) => Object.values(e.decks || {}).reduce((a, b) => a + b, 0);
const freeQty = (e) => Math.max(0, e.qty - inDecks(e));
function addToCollection({ oi, set, number, lang, foil, qty = 1, img = "" }) {
  const key = entryKey(set, number, foil, lang);
  let e = S.cards.find(x => x.key === key);
  if (e) { e.qty += qty; if (img && !e.img) e.img = img; }
  else { e = { key, oi, name: DB.o[oi][0], set, number: normNum(number), lang: lang || "en", foil: !!foil, qty, img, added: Date.now(), decks: {} }; S.cards.push(e); }
  save(); return e;
}

// ============ Organização das caixas: cor → raridade → tipo → nome ============
const COLOR_ORDER = [["W", "Branco"], ["U", "Azul"], ["B", "Preto"], ["R", "Vermelho"], ["G", "Verde"], ["M", "Multicolor"], ["C", "Incolor"], ["L", "Terrenos"]];
const COLOR_NAME = Object.fromEntries(COLOR_ORDER);
const COLOR_HEX = { W: "#e8e0c4", U: "#3d7cc0", B: "#6b6467", R: "#cf5a40", G: "#3f9a5c", M: "#d0a94e", C: "#9aa3ab", L: "#9a7a52" };
function colorBucket(oi) {
  const o = DB.o[oi]; const cols = o[3]; const types = mainTypes(o[5]);
  if (types.includes("Land") && !cols) return "L";
  if (!cols) return "C"; if (cols.length > 1) return "M"; return cols;
}
const tierOf = (e) => ["r", "m", "s", "b"].includes(rarityOf(e)) ? "R" : "C";
const TIER_NAME = { R: "Raras e míticas", C: "Comuns e incomuns" };
const SECTIONS = COLOR_ORDER.flatMap(([c]) => ["R", "C"].map(t => c + t));
const sectionOf = (e) => colorBucket(e.oi) + tierOf(e);
const sectionName = (s) => `${COLOR_NAME[s[0]]} · ${TIER_NAME[s[1]]}`;
function typeRank(oi) { const t = mainTypes(DB.o[oi][5]); const idx = TYPES.findIndex(x => t.includes(x[0])); return idx < 0 ? 99 : idx; }
function sectionCounts() { const c = Object.fromEntries(SECTIONS.map(s => [s, 0])); for (const e of S.cards) c[sectionOf(e)] += freeQty(e); return c; }
function buildLayout() {
  const cap = S.boxes.capacity, counts = sectionCounts(), boxes = []; let cur = { sections: [], n: 0 };
  for (const s of SECTIONS) {
    const n = counts[s];
    if (cur.sections.length && cur.n + n > cap * 0.85) { boxes.push(cur); cur = { sections: [], n: 0 }; }
    cur.sections.push(s); cur.n += n;
  }
  boxes.push(cur);
  S.boxes.layout = boxes.map((b, i) => ({ n: i + 1, sections: b.sections }));
  save();
}
function boxOfSection(s) {
  if (!S.boxes.layout) buildLayout();
  const b = S.boxes.layout.find(b => b.sections.includes(s)); return b ? b.n : 1;
}
function whereLib(e) { const s = sectionOf(e); const t = mainTypes(DB.o[e.oi][5])[0]; const tn = (TYPES.find(x => x[0] === t) || [, "Outros"])[1]; return { box: boxOfSection(s), section: s, text: `Caixa ${boxOfSection(s)} · ${sectionName(s)} · ${tn}` }; }

// ============ Imagens (Scryfall, em lotes, guardadas no aparelho) ============
let IMGS = {}; const imgQueue = new Set(); let imgTimer = 0, imgBusy = false;
const imgKey = (set, number) => set + "|" + normNum(number);
function imgSrc(set, number) {
  if (!set) return "";
  const k = imgKey(set, number); if (IMGS[k]) return IMGS[k];
  if (IMGS[k] !== "") { imgQueue.add(k); clearTimeout(imgTimer); imgTimer = setTimeout(fetchImgs, 150); }
  return "";
}
async function fetchImgs() {
  if (imgBusy || !imgQueue.size) return; imgBusy = true;
  try {
    while (imgQueue.size) {
      const keys = [...imgQueue].slice(0, 75); keys.forEach(k => imgQueue.delete(k));
      try {
        const r = await fetch("https://api.scryfall.com/cards/collection", { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify({ identifiers: keys.map(k => { const [set, collector_number] = k.split("|"); return { set, collector_number }; }) }) });
        if (r.status === 429) { keys.forEach(k => imgQueue.add(k)); await sleep(1500); continue; }
        const j = await r.json();
        for (const c of (j.data || [])) { const u = (c.image_uris || (c.card_faces && c.card_faces[0].image_uris) || {}).normal; if (u) IMGS[imgKey(c.set, c.collector_number)] = u; }
        for (const nf of (j.not_found || [])) if (nf.set) IMGS[imgKey(nf.set, nf.collector_number)] = "";
      } catch { await sleep(2000); }
      await sleep(150);
    }
    store.set("imgs", IMGS).catch(() => {});
    document.querySelectorAll("img[data-ik]").forEach(im => { const u = IMGS[im.dataset.ik]; if (u && !im.getAttribute("src")) im.src = u; });
  } finally { imgBusy = false; }
}
async function fillImages(entries) { entries.forEach(e => imgSrc(e.set, e.number)); }

// ============ Componentes visuais ============
const FLAGS = { en: "🇺🇸", pt: "🇧🇷", es: "🇪🇸", ja: "🇯🇵", fr: "🇫🇷", de: "🇩🇪", it: "🇮🇹", zhs: "🇨🇳", zht: "🇹🇼", ko: "🇰🇷", ru: "🇷🇺" };
const emojiOK = /Android|iPhone|iPad|Mac/i.test(navigator.userAgent);
function manaHTML(cost) {
  if (!cost) return "";
  return `<span class="mana">${String(cost).split(" // ").map(side => (side.match(/\{[^}]+\}/g) || []).map(m => { const s = m.slice(1, -1).toLowerCase().replace(/\//g, ""); return `<i class="ms ms-${esc(s === "t" ? "tap" : s)} ms-cost ms-shadow"></i>`; }).join("")).join(`<span style="opacity:.6;margin:0 3px">//</span>`)}</span>`;
}
function setHTML(set, rar) { const r = RAR[rar] || "common"; return `<i class="ss ss-${esc(String(set).replace(/[^a-z0-9]/g, "")) || "default"} ss-${["common","uncommon","rare","mythic"].includes(r) ? r : "common"} ss-grad"></i>`; }
function cardImgHTML(e, opts = {}) {
  const o = DB.o[e.oi]; const fc = "f-" + colorBucket(e.oi);
  const src = e.set ? imgSrc(e.set, e.number) : "";
  const inner = e.set ? `<img ${src ? `src="${esc(src)}"` : ""} data-ik="${esc(imgKey(e.set, e.number))}" alt="${esc(o[0])}" loading="lazy" onload="this.style.opacity=1" onerror="this.removeAttribute('src')" style="position:absolute;inset:0;opacity:${src ? 1 : 0};transition:opacity .2s">` : "";
  const drawn = `<div class="drawn ${fc}"><div class="dn">${esc(o[0])}</div><div></div><div class="dt">${esc(o[5])}</div></div>`;
  if (opts.bare) return `<div class="cardimg">${drawn}${inner}</div>`;
  const price = priceOf(e); const dq = inDecks(e);
  const deckName = dq ? (S.decks.find(d => e.decks[d.id]) || {}).name : "";
  return `<div class="cardimg">${drawn}${inner}
    ${e.qty > 1 ? `<span class="qtyb">${e.qty}</span>` : ""}
    ${dq ? `<span class="deckb" title="Em deck">${esc(deckName)}${dq < e.qty ? ` ${dq}/${e.qty}` : ""}</span>` : ""}
    ${price ? `<span class="price">${fmtUSD(price)}</span>` : ""}
    ${emojiOK && FLAGS[e.lang] ? `<span class="flag">${FLAGS[e.lang]}</span>` : `<span class="flag txt">${esc((e.lang || "en").toUpperCase())}</span>`}
    ${e.foil ? `<span class="dot" title="Foil"></span>` : ""}</div>`;
}

// ============ Navegação ============
let tab = "col", view = null; // view: {kind:'deck', id}
const views = { col: renderCol, scan: renderScan, decks: renderDecks, boxes: renderBoxes };
function go(t, v = null) {
  if (t !== "scan" && tab === "scan") stopCamera();
  tab = t; view = v; closeSheet(); $("menu").classList.add("hidden");
  document.querySelectorAll("nav.bottom button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"));
  const scan = t === "scan";
  $("scanView").classList.toggle("hidden", !scan); $("appbar").classList.toggle("hidden", scan); $("main").classList.toggle("hidden", scan);
  $("backBtn").classList.toggle("invisible", !v);
  $("fab").classList.add("hidden");
  window.scrollTo(0, 0);
  views[t]();
}
$("nav").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
$("backBtn").onclick = () => go(tab);
function setMenu(items) {
  $("menu").innerHTML = items.map((it, i) => `<button data-i="${i}">${esc(it[0])}</button>`).join("");
  $("menu").onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; $("menu").classList.add("hidden"); items[+b.dataset.i][1](); };
  $("menuBtn").classList.toggle("invisible", !items.length);
}
$("menuBtn").onclick = (e) => { e.stopPropagation(); $("menu").classList.toggle("hidden"); };
document.addEventListener("click", (e) => { if (!e.target.closest("#menu, #menuBtn")) $("menu").classList.add("hidden"); });

// Folha (sheet)
function openSheet(body, foot = "") { $("sheetBody").innerHTML = body; $("sheetFoot").innerHTML = foot; $("sheetFoot").classList.toggle("hidden", !foot); $("sheet").classList.remove("hidden"); $("scrim").classList.remove("hidden"); $("sheetBody").scrollTop = 0; }
function closeSheet() { $("sheet").classList.add("hidden"); $("scrim").classList.add("hidden"); if (tab === "scan") SC.paused = false; }
$("scrim").onclick = closeSheet;

// ============ COLEÇÃO ============
const F = { q: "", colors: new Set(), type: "", role: "", where: "", sort: "name", view: "grid", open: false };
function colFiltered() {
  const q = norm(F.q);
  let arr = S.cards.filter(e => e.qty > 0);
  if (q) arr = arr.filter(e => norm(e.name + " " + DB.o[e.oi][5] + " " + e.set).includes(q));
  if (F.colors.size) arr = arr.filter(e => { const b = colorBucket(e.oi); return [...F.colors].every(c => c === b || (b === "M" && DB.o[e.oi][3].includes(c))); });
  if (F.type) arr = arr.filter(e => mainTypes(DB.o[e.oi][5]).includes(F.type));
  if (F.role) arr = arr.filter(e => oInfo(e.oi).roles.includes(F.role));
  if (F.where === "lib") arr = arr.filter(e => freeQty(e) > 0); else if (F.where === "deck") arr = arr.filter(e => inDecks(e) > 0);
  else if (F.where.startsWith("box")) { const n = +F.where.slice(3); arr = arr.filter(e => freeQty(e) > 0 && boxOfSection(sectionOf(e)) === n); }
  const by = {
    name: (a, b) => a.name.localeCompare(b.name), price: (a, b) => priceOf(b) - priceOf(a),
    recent: (a, b) => b.added - a.added, cmc: (a, b) => DB.o[a.oi][2] - DB.o[b.oi][2] || a.name.localeCompare(b.name),
    box: (a, b) => { const sa = SECTIONS.indexOf(sectionOf(a)), sb = SECTIONS.indexOf(sectionOf(b)); return boxOfSection(sectionOf(a)) - boxOfSection(sectionOf(b)) || sa - sb || typeRank(a.oi) - typeRank(b.oi) || a.name.localeCompare(b.name); },
    set: (a, b) => a.set.localeCompare(b.set) || (parseInt(a.number) || 0) - (parseInt(b.number) || 0)
  }[F.sort];
  return arr.sort(by);
}
function renderCol() {
  $("title").textContent = "Coleção";
  setMenu([["Importar lista (CSV ou texto)", importDialog], ["Exportar CSV (Moxfield/Archidekt)", exportCSV], ["Fazer backup (arquivo)", backup], ["Restaurar backup", restore], ["Buscar imagens que faltam", () => { Object.keys(IMGS).forEach(k => { if (IMGS[k] === "") delete IMGS[k]; }); toast("Buscando imagens…"); drawCol(); }]]);
  if (!$("colBars")) {
    $("bars").innerHTML = `<div id="colBars">
      <div class="toolbar"><input type="search" id="q" placeholder="Filtrar…" aria-label="Filtrar">
        <button class="iconbtn" id="viewBtn" aria-label="Grade ou lista"></button>
        <span class="iconbtn" title="Ordenar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h6"/></svg>
          <select id="sortSel" aria-label="Ordenar"><option value="name">Nome</option><option value="box">Ordem das caixas</option><option value="price">Preço</option><option value="recent">Recentes</option><option value="cmc">Custo de mana</option><option value="set">Coleção e número</option></select></span></div>
      <div class="subbar"><div class="subrow"><span class="count" id="colCount"></span><button class="addfilter" id="filterToggle">Filtros <span class="plus">+</span></button></div>

function parseCSVLine(line) { const out = []; let cur = "", q = false; for (let i = 0; i < line.length; i++) { const ch = line[i]; if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; } else if (ch === '"') q = true; else if (ch === "," || ch === ";" || ch === "\t") { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(x => x.trim()); }

function parseList(text) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean); if (!lines.length) return [];
  const head = parseCSVLine(lines[0]).map(h => h.toLowerCase()); const col = (...n) => head.findIndex(h => n.includes(h));
  const iName = col("name", "card name", "card");
  if (iName >= 0) {
    const iQty = col("count", "quantity", "qty"), iSet = col("edition", "set code", "set"), iNum = col("collector number", "collector_number", "card number", "number"), iFoil = col("foil", "printing", "finish"), iLang = col("language", "lang");
    return lines.slice(1).map(l => { const r = parseCSVLine(l); const fv = String(r[iFoil] || "").toLowerCase(), lv = String(r[iLang] || "").toLowerCase();
      return { qty: parseInt(r[iQty], 10) || 1, name: r[iName] || "", set: (r[iSet] || "").toLowerCase(), number: r[iNum] || "", foil: /^(foil|etched|true|yes|1)$/.test(fv), lang: LANG_NAMES[lv] || (lv.length <= 3 ? lv : "") || "en" }; }).filter(x => x.name);
  }
  let board = "main";
  return lines.map(l => {
    if (/^(sideboard|side|reserva)/i.test(l)) { board = "side"; return null; } if (/^(commander|comandante)/i.test(l)) { board = "cmd"; return null; } if (/^(deck|main|maindeck)/i.test(l)) { board = "main"; return null; }
    const m = l.match(/^(\d+)\s*x?\s+(.+?)(?:\s+\(([A-Za-z0-9]{2,6})\)(?:\s+([^\s*]+))?)?(\s+\*F\*)?$/); if (!m) return null;
    return { qty: +m[1], name: m[2].trim(), set: (m[3] || "").toLowerCase(), number: m[4] || "", foil: !!m[5], lang: "en", board };
  }).filter(Boolean);
}

}

$("scanView").addEventListener("pointerup", async (ev) => {

function guideRect() { const v = $("video"), g = $("guide").getBoundingClientRect(), vb = v.getBoundingClientRect(), VW = v.videoWidth, VH = v.videoHeight; if (!VW) return null; const s = Math.max(vb.width / VW, vb.height / VH); const ox = vb.left + (vb.width - VW * s) / 2, oy = vb.top + (vb.height - VH * s) / 2; return { x: (g.left - ox) / s, y: (g.top - oy) / s, w: g.width / s, h: g.height / s }; }

async function tick() {

    await worker.setParameters({ tessedit_pageseg_mode: "6" });
