<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<title>Biblioteca MTG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/mana.css">
<link rel="stylesheet" href="css/keyrune.css">
<style>
/* Layout: app de coleção para celular com navegação inferior (Coleção, Escanear, Decks, Caixas). Barra de título fixa; conteúdo rolável; folhas que sobem de baixo para detalhes. Tema único escuro. */
:root {
  --bg: #1d2129; --bar: #262b34; --surface: #2b3039; --surface-2: #343a45;
  --ink: #eef1f6; --muted: #9aa3b3; --line: #3a404c;
  --accent: #f2a35e; --accent-ink: #1d1a16; --link: #7ea8de; --ok: #55d08d; --warn: #f0b04a; --bad: #f08a7a;
  --fW: #e8e0c4; --fU: #3d7cc0; --fB: #6b6467; --fR: #cf5a40; --fG: #3f9a5c; --fM: #d0a94e; --fC: #9aa3ab; --fL: #9a7a52;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.hidden { display: none !important; }
.invisible { visibility: hidden; }
.meta { color: var(--muted); font-size: 13px; }
.mana { display: inline-flex; gap: 2px; align-items: center; font-size: 14px; flex: none; }

/* Barra de título */
.appbar { position: sticky; top: 0; z-index: 10; background: var(--bar); box-shadow: 0 1px 0 rgba(0,0,0,.35); padding-top: env(safe-area-inset-top); }
.titlebar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 8px 10px 4px; max-width: 900px; margin: 0 auto; }
.titlebar h1 { margin: 0; text-align: center; font-size: 20px; font-weight: 600; }
.titlebar h1[data-cloud="on"]::after { content: " ☁"; font-size: 14px; color: var(--ok); vertical-align: middle; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); position: relative; }
.iconbtn:hover { background: rgba(255,255,255,.06); }
.iconbtn svg { width: 24px; height: 24px; }
.iconbtn select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; padding: 4px 12px 10px; max-width: 900px; margin: 0 auto; }
.toolbar input { border: 0; background: #3a404b; border-radius: 8px; padding: 0 14px; height: 44px; font-size: 16px; width: 100%; min-width: 0; }
.toolbar input::placeholder { color: #a7afbd; }
.subbar { background: #1f2a36; }
.subrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; }
.count { color: var(--link); font-style: italic; font-variant-numeric: tabular-nums; }
.addfilter { border: 0; background: transparent; color: var(--link); font-style: italic; display: inline-flex; align-items: center; gap: 8px; padding: 0; }
.addfilter .plus { width: 32px; height: 32px; border-radius: 50%; background: #5a7ea8; color: #10161d; display: grid; place-items: center; font-size: 22px; font-style: normal; font-weight: 700; }
.filterpanel { display: grid; gap: 10px; padding: 0 14px 12px; max-width: 900px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--link); background: rgba(126,168,222,.18); color: #cfe0f6; }
.chip .ms { font-size: 18px; }
select, input[type="text"], input[type="search"], input[type="number"], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 11px; min-height: 42px; width: 100%; color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

main { max-width: 900px; margin: 0 auto; padding: 12px 12px calc(var(--nav-h) + 130px + env(safe-area-inset-bottom)); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 9px; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 4px 8px; font-weight: 600; display: flex; justify-content: space-between; }

/* Navegação inferior */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--bar); box-shadow: 0 -1px 0 rgba(0,0,0,.4); display: flex; padding-bottom: env(safe-area-inset-bottom); }
nav.bottom button { border: 0; background: transparent; color: var(--muted); height: var(--nav-h); display: grid; place-items: center; gap: 2px; font-size: 12px; padding: 6px 0; }
nav.bottom button svg { width: 24px; height: 24px; }
nav.bottom button[aria-current="page"] { color: var(--accent); }

/* Grade */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 860px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 0; border-radius: 9px; padding: 8px 6px 6px; display: grid; gap: 6px; text-align: center; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.25); min-width: 0; }
.tile .tname { font-weight: 600; font-size: 13.5px; line-height: 1.2; min-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; align-self: center; overflow-wrap: anywhere; }
.cardimg { position: relative; aspect-ratio: 488 / 680; border-radius: 6% / 4.3%; overflow: hidden; background: #111; }
.cardimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cardimg .qtyb { position: absolute; left: 6%; top: 3.5%; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; background: rgba(20,22,26,.85); color: #fff; font: 700 14px/26px var(--font); }
.cardimg .price { position: absolute; left: 5%; bottom: 16%; background: rgba(20,22,26,.85); color: #fff; font-weight: 600; font-size: 11px; padding: 5px 7px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cardimg .flag { position: absolute; left: 6%; bottom: 5%; font-size: 15px; line-height: 1; }
.cardimg .flag.txt { font-size: 10px; font-weight: 700; background: rgba(20,22,26,.85); padding: 3px 5px; border-radius: 4px; }
.cardimg .dot { position: absolute; right: 6%; bottom: 5%; width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(20,22,26,.85); background: conic-gradient(#ff9ec7, #9ed8ff, #b6ffa8, #fff59e, #ff9ec7); }
.cardimg .deckb { position: absolute; right: 5%; top: 3.5%; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 6px; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawn { position: absolute; inset: 0; padding: 22% 8% 28%; display: grid; grid-template-rows: auto 1fr auto; gap: 6%; background: linear-gradient(180deg, color-mix(in srgb, var(--frame, var(--fC)) 55%, #1a1a1a), color-mix(in srgb, var(--frame, var(--fC)) 25%, #111)); }
.drawn .dn { background: rgba(255,255,255,.85); color: #1a1a1a; border-radius: 4px; padding: 4px 5px; font-size: 10px; font-weight: 600; text-align: left; }
.drawn .dt { background: rgba(255,255,255,.85); color: #1a1a1a; border-radius: 3px; padding: 3px 5px; font-size: 9px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.f-W { --frame: var(--fW); } .f-U { --frame: var(--fU); } .f-B { --frame: var(--fB); } .f-R { --frame: var(--fR); } .f-G { --frame: var(--fG); } .f-M { --frame: var(--fM); } .f-C { --frame: var(--fC); } .f-L { --frame: var(--fL); }
.setline { display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 13px; min-width: 0; }
.setline .ss { font-size: 17px; }
.setline .num { font-style: italic; font-weight: 400; color: var(--muted); }

/* Listas */
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 0; border-radius: 8px; padding: 6px 10px 6px 6px; text-align: left; color: var(--ink); width: 100%; }
.row .cardimg { width: 44px; border-radius: 3px; }
.row .rn { font-weight: 600; overflow-wrap: anywhere; }
.row .rs { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .rr { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: #cfd5df; background: var(--surface-2); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: rgba(85,208,141,.4); }
.pill.warn { color: var(--warn); border-color: rgba(240,176,74,.4); }
.pill.bad { color: var(--bad); border-color: rgba(240,138,122,.4); }
.pill.acc { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: 9px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.fab { position: fixed; right: 18px; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); width: 64px; height: 64px; border-radius: 12px; border: 3px solid #7a4a1f; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.5); z-index: 12; }
.fab svg { width: 34px; height: 34px; }

/* Decks */
.deckcard { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: 9px; padding: 10px; border: 0; color: var(--ink); text-align: left; width: 100%; }
.deckcard .cardimg { width: 56px; border-radius: 4px; }
.deckcard b { font-size: 16px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.ok i { background: var(--ok); }
.bar.over i { background: var(--bad); }
.curve { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 110px; padding: 6px 0 0; }
.curve div { display: grid; grid-template-rows: auto 1fr auto; align-items: end; justify-items: center; height: 100%; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.curve i { display: block; width: 100%; background: var(--link); border-radius: 4px 4px 0 0; min-height: 2px; }
.colorbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 8px; text-align: center; }
.kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); }
.roles { display: flex; flex-wrap: wrap; gap: 6px; }

/* Caixas */
.boxcard { background: var(--surface); border-radius: 9px; padding: 12px; display: grid; gap: 8px; }
.boxcard h3 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; }
.secrow { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; font-size: 14px; padding: 4px 0; border-top: 1px solid var(--line); }
.secrow .sw { width: 14px; height: 14px; border-radius: 3px; }

/* Folhas */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; background: var(--bar); border-radius: 12px 12px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.6); z-index: 30; display: grid; grid-template-rows: auto 1fr auto; padding-bottom: env(safe-area-inset-bottom); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #4a515e; margin: 8px auto 0; }
.sheet .body { overflow: auto; padding: 12px 16px; display: grid; gap: 12px; align-content: start; }
.sheet .foot { padding: 10px 16px 14px; display: flex; gap: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet .foot .btn { flex: 1; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 29; }
.detail { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; }
.detail .cardimg { width: 120px; }
.detail h3 { margin: 0 0 4px; font-size: 19px; line-height: 1.2; }
.textbox { background: var(--surface); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; height: 40px; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 40px; height: 100%; font-size: 20px; color: var(--accent); }
.stepper span { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.loc { display: grid; gap: 6px; }
.loc div { display: flex; justify-content: space-between; gap: 8px; background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); background: #eef1f6; color: #1d2129; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.menu { position: absolute; right: 10px; top: 52px; background: var(--surface-2); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 6px; display: grid; min-width: 240px; z-index: 40; }
.menu button { border: 0; background: transparent; text-align: left; padding: 11px 12px; border-radius: 8px; color: var(--ink); }
.menu button:hover { background: rgba(255,255,255,.06); }
.splash { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; }
.splash .box { display: grid; gap: 14px; max-width: 360px; width: 100%; }
.pbar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* Scanner */
#scanView { position: fixed; inset: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: #000; z-index: 5; overflow: hidden; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; transition: transform .08s linear; }
.guide { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); aspect-ratio: 63 / 88; width: min(64vw, 46vh * 63 / 88); border-radius: 4.5% / 3.2%; box-shadow: 0 0 0 200vmax rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.85); }
.guide.seen { border-color: var(--warn); } .guide.lock { border-color: var(--ok); }
.guide .band { position: absolute; left: 5%; right: 5%; border: 1.5px dashed rgba(255,255,255,.5); border-radius: 4px; }
.guide .band.t { top: 2.5%; height: 8%; } .guide .band.f { bottom: 1.8%; height: 8.5%; right: 45%; }
.scantop { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; display: flex; gap: 6px; align-items: center; background: linear-gradient(rgba(0,0,0,.75), transparent); flex-wrap: wrap; }
.chipbtn { border: 1px solid rgba(255,255,255,.25); background: rgba(30,33,40,.8); color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scanstatus { position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; background: rgba(20,22,26,.85); padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; color: #fff; }
.scanbottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
.roundbtn { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(30,33,40,.85); color: #fff; display: grid; place-items: center; font-weight: 700; }
.roundbtn svg { width: 24px; height: 24px; }
.roundbtn[aria-pressed="true"] { background: #fff3c4; color: #222; }
.lastscan { display: inline-flex; gap: 8px; align-items: center; border: 0; background: rgba(30,33,40,.85); color: #fff; padding: 8px 12px; border-radius: 9px; font-size: 13px; max-width: 46%; }
.lastscan b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; min-width: 24px; height: 24px; display: inline-grid; place-items: center; padding: 0 6px; }
.focusring { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 2px solid #ffd54a; border-radius: 50%; pointer-events: none; animation: ring 1s ease-out forwards; }
@keyframes ring { from { transform: scale(1.5); opacity: 1; } to { transform: scale(1); opacity: .2; } }
.mf { position: absolute; left: 12px; right: 12px; bottom: 140px; display: flex; align-items: center; gap: 10px; background: rgba(20,22,26,.75); padding: 8px 12px; border-radius: 9px; color: #fff; font-size: 11px; }
.mf input { flex: 1; accent-color: var(--accent); }
#dbg { position: absolute; left: 12px; right: 12px; bottom: calc(196px + env(safe-area-inset-bottom)); background: rgba(10,11,14,.72); padding: 6px 8px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; z-index: 3; pointer-events: none; backdrop-filter: blur(6px); }
#dbg.hidden { display: none; }
#dbg canvas { height: 26px; width: auto; max-width: 48%; background: #fff; border-radius: 4px; opacity: .85; }
#dbg pre { flex: 0 0 100%; margin: 0; color: #fff; font: 11px/1.3 ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.via { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 6px; }
.via.ok { color: var(--ok); background: rgba(85,208,141,.1); } .via.warn { color: var(--warn); background: rgba(240,176,74,.1); }
@media (max-width: 380px) { .tile .tname { font-size: 12.5px; } .kpis { grid-template-columns: repeat(2, 1fr); } }
/* ===== Zoom da carta ===== */
.zoom { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.88); display: grid; place-items: center; align-content: center; gap: 10px; padding: 16px; cursor: zoom-out; }
.zoom img { max-width: min(94vw, 680px); max-height: 86vh; border-radius: 4.5%; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.zoom .meta { text-align: center; }
.zoomact { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.zoomact:empty { display: none; }
.zoom.withact { cursor: default; }
.zoom.withact img { max-height: 72vh; }
.detail .cardimg, .ed-preview .cardimg, .zoomable { cursor: zoom-in; }
/* ===== Editor de decks ===== */
body.wide main, body.wide .titlebar { max-width: none; }
body.wide main { padding-left: 10px; padding-right: 10px; }
.edtabs { display: none; gap: 6px; margin-bottom: 10px; position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 5; background: var(--bg); padding: 6px 0; }
.edtabs button { flex: 1; border: 1px solid var(--line, #333); background: var(--surface, #1d2026); border-radius: 999px; padding: 8px; font-weight: 600; }
.edtabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.editor { display: grid; grid-template-columns: 300px 1fr 300px; gap: 14px; align-items: start; }
.editor > section { min-width: 0; }
.ed-search, .ed-stats { position: sticky; top: calc(64px + env(safe-area-inset-top)); max-height: calc(100vh - 80px); overflow: auto; }
.ed-sbox { display: grid; gap: 8px; margin-bottom: 8px; }
.ed-sbox input[type=search], .ed-sbox select, .editor select { width: 100%; background: var(--surface, #1d2026); border: 1px solid var(--line, #333); border-radius: 8px; padding: 8px; }
.ed-sbox .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ck { display: flex; gap: 6px; align-items: center; }
.ed-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-top: 6px; }
.res { display: grid; gap: 3px; }
.res button { border: 0; background: none; padding: 0; text-align: left; }
.resimg { position: relative; }
.resimg:hover .cardimg { outline: 2px solid var(--accent); }
.resname { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===================== TEMA "MIDNIGHT TEAL" ===================== */
:root {
  --bg: #121316; --bar: #17181c; --surface: #1d1f24; --surface-2: #26292f; --line: #2c2f36;
  --ink: #f2f4f7; --muted: #8b919c; --link: var(--c3);
  --c1: #e8413a; --c2: #ff7a45; --c3: #ffc24b; --acc-rgb: 255,122,69; --c1-rgb: 232,65,58; --c3-rgb: 255,194,75; --tint: #ffe2cf; --hot: #221a18;
  --accent: var(--c2); --accent-2: var(--c3); --accent-ink: #2a0d05;
  --grad: linear-gradient(135deg, var(--c1) 0%, var(--c2) 50%, var(--c3) 100%);

  --ok: #7ee2a0; --warn: #f2c86b; --bad: #ff8b8b;
  --r-lg: 12px; --r-md: 9px; --r-sm: 7px;
  --font: "Poppins", "Roboto", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
html, body { background: radial-gradient(1200px 600px at 50% -10%, var(--hot) 0%, var(--bg) 60%) fixed; letter-spacing: .1px; }
.appbar { background: rgba(18,19,22,.78); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: none; border-bottom: 1px solid rgba(255,255,255,.04); }
.titlebar h1 { font-weight: 500; font-size: 19px; letter-spacing: .2px; }
.iconbtn { background: var(--surface); border-radius: 50%; transition: transform .2s var(--spring), background .2s; }
.iconbtn.invisible { background: transparent; }
.toolbar input, select, input[type="text"], input[type="search"], input[type="number"], textarea, .ed-sbox input[type=search], .ed-sbox select, .editor select {
  background: var(--surface); border: 1px solid transparent; border-radius: var(--r-md); transition: border-color .2s, box-shadow .2s; }
.toolbar input:focus, select:focus, input:focus, textarea:focus { outline: none; border-color: rgba(var(--acc-rgb),.55); box-shadow: 0 0 0 4px rgba(var(--acc-rgb),.12); }
.subbar { background: transparent; }
.count, .addfilter { color: var(--muted); font-style: normal; }
.addfilter .plus { background: var(--grad); color: var(--accent-ink); box-shadow: var(--glow); }
.chip { background: var(--surface); border-color: transparent; transition: all .2s var(--ease); }
.chip[aria-pressed="true"] { background: rgba(var(--acc-rgb),.14); border-color: rgba(var(--acc-rgb),.5); color: var(--tint); }
.tile, .row, .deckcard, .card, .col, .kpi { background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.25); }
.row, .deckcard { border-radius: var(--r-md); }
.kpi { border-radius: var(--r-md); background: var(--surface-2); box-shadow: none; }
.kpi b { font-weight: 600; }
.card { padding: 18px; }
.btn { border-radius: 999px; border-color: transparent; background: var(--surface-2); font-weight: 500; transition: transform .18s var(--spring), box-shadow .2s, filter .2s; }
.btn.primary { background: var(--grad); color: var(--accent-ink); box-shadow: var(--glow); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { border-radius: 999px; }
.pill { border-radius: 999px; background: var(--surface-2); border-color: transparent; }
.pill.acc { background: var(--grad); }
.bar { background: var(--surface-2); height: 6px; } .bar i { background: var(--grad); border-radius: 4px; }
.curve i { background: linear-gradient(180deg, var(--c3), var(--c1)); border-radius: 6px 6px 2px 2px; transform-origin: bottom; animation: growUp .6s var(--ease) both; }
.curve div:nth-child(2) i { animation-delay: .04s } .curve div:nth-child(3) i { animation-delay: .08s } .curve div:nth-child(4) i { animation-delay: .12s } .curve div:nth-child(5) i { animation-delay: .16s } .curve div:nth-child(6) i { animation-delay: .2s } .curve div:nth-child(7) i { animation-delay: .24s } .curve div:nth-child(8) i { animation-delay: .28s }
.hbar i { background: var(--grad); transform-origin: left; animation: growRight .6s var(--ease) both; }
.colorbar { height: 10px; border-radius: 999px; gap: 2px; }
.colorbar span { border-radius: 999px; }
.cardimg { border-radius: 5.5% / 4%; }
.fab { bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom)); border: 0; border-radius: 12px; background: var(--grad); color: var(--accent-ink); box-shadow: var(--glow), 0 10px 30px rgba(0,0,0,.4); transition: transform .25s var(--spring); animation: popIn .45s var(--spring) both; }

// Nomes em português (Brasil): gerados do MTGJSON por tools/build_pt.py

// Nomes em outros idiomas (pt, es, fr, de, it) — gerados do MTGJSON por tools/build_pt.py.
// Servem para a busca digitada e para o scanner reconhecer cartas não inglesas pelo nome.
const FLAG = { pt: "🇧🇷", es: "🇪🇸", fr: "🇫🇷", de: "🇩🇪", it: "🇮🇹" };
// Descompacta .gz: usa o recurso do navegador; em iPhones/navegadores mais antigos (sem DecompressionStream) usa o pako
async function gunzipText(blob) {

// Busca os links das imagens no Scryfall. Se o Scryfall estiver fora do ar (manutenção, 5xx, sem internet),

}

// ============ BACKUPS AUTOMÁTICOS (na nuvem do app) ============
// A cada 5 dias o primeiro aparelho que abrir o app grava uma cópia completa em libs/principal/backups.
// Ficam só as 3 mais recentes. Cada cópia é dividida em partes (limite de 1 MB por documento).
const BK = { every: 5 * 864e5, keep: 3, part: 700000, running: false };
const bkCol = () => base().collection("backups");
async function makeBackup(reason = "auto") {
  if (!CLOUD.user) throw new Error("sem login");
  const json = JSON.stringify({ v: 2, at: new Date().toISOString(), cards: S.cards, decks: S.decks, boxes: S.boxes, liga: S.liga || {} });
  const parts = []; for (let i = 0; i < json.length; i += BK.part) parts.push(json.slice(i, i + BK.part));
  const ref = bkCol().doc(String(Date.now()));
  for (let i = 0; i < parts.length; i++) await ref.collection("parts").doc(String(i)).set({ d: parts[i] });
  await ref.set({ at: Date.now(), by: CLOUD.user.email, reason, cards: S.cards.reduce((a, e) => a + e.qty, 0), decks: S.decks.length, parts: parts.length, bytes: json.length });
  await base().collection("meta").doc("backup").set({ lastAt: Date.now(), by: CLOUD.user.email });
  const all = await bkCol().orderBy("at", "desc").get();
  for (const d of all.docs.slice(BK.keep)) { const ps = await d.ref.collection("parts").get(); for (const x of ps.docs) await x.ref.delete(); await d.ref.delete(); }
  return ref.id;
}
async function autoBackup() {
  if (BK.running || !cloudReady()) return; BK.running = true;
  try {
    const m = await base().collection("meta").doc("backup").get();
    const last = m.exists ? m.data().lastAt || 0 : 0;
    if (Date.now() - last >= BK.every && (S.cards.length || S.decks.length)) { await makeBackup("auto"); console.info("backup automático feito"); }
  } catch (e) { console.warn("backup automático falhou", e); }
  BK.running = false;
}
async function loadBackup(id) {
  const ps = await bkCol().doc(id).collection("parts").get();
  const json = ps.docs.sort((a, b) => +a.id - +b.id).map(d => d.data().d).join("");
  return JSON.parse(json);
}

// ============ MOVER UMA CÓPIA: caixa ↔ deck ↔ outro deck ============
// "from": id do deck de onde sai a cópia (ou null = das caixas). Tira 1 cópia física de lá e põe no destino,
// atualizando as listas dos decks (sai da lista de origem, entra na de destino).
function moveCopy(oi, from, toId, key) {
  const name = DB.o[oi][0]; const src = from ? S.decks.find(x => x.id === from) : null; const dst = toId ? S.decks.find(x => x.id === toId) : null;
  const pool = S.cards.filter(e => e.oi === oi && (from ? (e.decks || {})[from] > 0 : freeQty(e) > 0));
  const e = pool.find(x => x.key === key) || pool[0];
  if (!e) return toast(from ? `${name} não está montada em ${src ? src.name : "esse deck"}.` : `Não há cópia livre de ${name} nas caixas.`), false;
  if (dst) { const c = dst.cards.find(x => x.oi === oi && x.board !== "maybe") || null; const need = c ? c.qty - haveFor(dst, oi) : 0;
    if (c && need <= 0 && isCmdFormat(dst) && !/Basic Land/.test(DB.o[oi][5])) return toast(`${name} já está montada em ${dst.name}.`), false;
    if (!c) dst.cards.push({ oi, qty: 1, board: "main", set: e.set, number: e.number, foil: !!e.foil }); else if (need <= 0) c.qty++; }
  if (src) { e.decks[from]--; if (!e.decks[from]) delete e.decks[from];
    const c = src.cards.find(x => x.oi === oi && x.board !== "cmd" && x.board !== "maybe") || src.cards.find(x => x.oi === oi);
    if (c) { if (c.qty > 1) c.qty--; else src.cards = src.cards.filter(x => x !== c); } }

  return true;
}

function searchCards() {

  for (const i of list) {
    const o = DB.o[i];
    if (q && !norm(o[0]).includes(q) && !ptN(i).includes(q) && !norm(o[5]).includes(q) && !(q.length > 3 && norm(o[6]).includes(q))) continue;
    if (ci && o[4] && o[4].split("").some(c => !ci.has(c))) continue;
    if (ED.colors.size) { const cols = o[3]; if (ED.colors.has("C") ? cols : ![...ED.colors].every(c => cols.includes(c))) continue; }
    if (ED.type && !mainTypes(o[5]).includes(ED.type)) continue;

    if (ED.role && !o[8].split("").map(ch => DB.roles[parseInt(ch, 36)]).includes(ED.role)) continue;

  return { list: out.slice(0, LIM), total };
}

const CMD_RX = /\b(Partner|Friends forever|Doctor's companion|Choose a Background)\b/;

function canPair(a, b) {

function boxMoves(oldMap, newMap) {
  const counts = boxCounts(); const out = [];
  for (const g of GROUP_ORDER) bucketsOf(g).forEach((lab, k) => { const n = counts[g][k]; if (!n) return;
    const f = (m) => { const sl = (m[g] || []).find(x => k >= x.a && k <= x.b); return sl ? slotCode(g, sl) : "?"; };
    const a = f(oldMap || {}), b = f(newMap); if (a !== b) out.push({ g, lab, n, a, b }); });

}
